services:
    dynamodb:
        image: amazon/dynamodb-local:latest
        container_name: lunaris-dynamodb
        command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
        ports:
            - "8000:8000"
        networks:
            - lunaris-network

    lambda:
        build:
            context: .
            dockerfile: lambda/Dockerfile
        container_name: lunaris-lambda
        command: ["handlers/api.handler"]
        ports:
            - "9000:8080"
        environment:
            - AWS_REGION=us-east-1
            - AWS_ACCESS_KEY_ID=dummy
            - AWS_SECRET_ACCESS_KEY=dummy
            - DYNAMODB_ENDPOINT=http://dynamodb:8000
            - RUNNING_INSTANCES_TABLE_NAME=RunningInstances
            - RUNNING_STREAMS_TABLE_NAME=RunningStreams
            - USER_PAYMENTS_TABLE_NAME=UserPayments
            - USER_BALANCES_TABLE_NAME=UserBalances
            - FRONTEND_URL=http://localhost:3000
            - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
            - STRIPE_WH_SECRET=${STRIPE_WH_SECRET:-}
            - STRIPE_PRICE_ID_STARTER=${STRIPE_PRICE_ID_STARTER:-}
            - STRIPE_PRICE_ID_BASIC=${STRIPE_PRICE_ID_BASIC:-}
            - STRIPE_PRICE_ID_STANDARD=${STRIPE_PRICE_ID_STANDARD:-}
            - STRIPE_PRICE_ID_PREMIUM=${STRIPE_PRICE_ID_PREMIUM:-}
            - STRIPE_PRICE_ID_PRO=${STRIPE_PRICE_ID_PRO:-}
        depends_on:
            - dynamodb
        networks:
            - lunaris-network
    frontend:
        container_name: lunaris-frontend
        platform: linux/amd64
        build:
            context: .
            dockerfile: frontend/Dockerfile
        environment:
            - NODE_ENV=production
            - NEXT_PUBLIC_API_URL=http://localhost:9000
        ports:
            - "3000:3000"
        networks:
            - lunaris-network

networks:
    lunaris-network:
        driver: bridge
